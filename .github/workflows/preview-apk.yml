name: Preview APK

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'

jobs:
  build:
    name: Build Preview APK
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK via EAS
        id: eas_build
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json 2>/dev/null || \
                         eas build --platform android --profile preview --non-interactive)
          # Extract the artifact URL from JSON output if available
          APK_URL=$(echo "$BUILD_OUTPUT" | python3 -c "import sys,json; data=json.load(sys.stdin); print(data[0]['artifacts']['buildUrl'])" 2>/dev/null || echo "")
          if [ -z "$APK_URL" ]; then
            # Fall back to the EAS build dashboard URL using the project ID
            APK_URL="https://expo.dev/accounts/billioniare101/projects/royal-ludo/builds"
          fi
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Upload preview APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk-${{ github.run_number }}
          path: apps/mobile/preview.apk
          retention-days: 14

      - name: Comment APK download link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const apkUrl = '${{ steps.eas_build.outputs.apk_url }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## 📦 Preview APK Ready',
              '',
              `**Direct download:** [Download APK](${apkUrl})`,
              '',
              `**EAS Builds dashboard:** https://expo.dev/accounts/billioniare101/projects/royal-ludo/builds`,
              '',
              `**GitHub Actions run:** [View run](${runUrl})`,
              '',
              '_This APK is for testing purposes only. Built from commit ${{ github.sha }}._',
            ].join('\n');

            // Update existing comment if present, otherwise create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('📦 Preview APK Ready'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
