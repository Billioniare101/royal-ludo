name: Preview APK

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'

jobs:
  build:
    name: Build Preview APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK via EAS
        run: eas build --platform android --profile preview --non-interactive --output preview.apk

      - name: Upload preview APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk-${{ github.run_number }}
          path: apps/mobile/preview.apk
          retention-days: 14
